; vernon_project MCP server, streamable-http transport, for claude.ai Connectors.
; Standalone file (not part of bench-generated config/supervisor.conf, which
; `bench setup supervisor` can regenerate/overwrite) and not in the
; frappe-bench-web/workers groups, so tj-restart never touches it. Secrets
; live only in .env.http (gitignored) via run_http.sh, never in this file.
[program:vernon-mcp-http]
command=/home/frappe/frappe-bench/apps/vernon_project/mcp_server/run_http.sh
directory=/home/frappe/frappe-bench/apps/vernon_project/mcp_server
autostart=true
autorestart=true
user=frappe
stdout_logfile=/home/frappe/frappe-bench/apps/vernon_project/mcp_server/mcp-http.log
stderr_logfile=/home/frappe/frappe-bench/apps/vernon_project/mcp_server/mcp-http.error.log
startretries=10
