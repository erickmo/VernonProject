# vernon_project MCP server (remote, claude.ai Connectors). Cloudflare
# (proxied) terminates TLS -> origin :80 -> here -> proxied to the
# supervisor-managed streamable-http process on 127.0.0.1:8811. The process
# itself checks ?token=/Authorization: Bearer — nginx just forwards.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.vernon.id;

    location / {
        proxy_pass http://127.0.0.1:8811;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # streamable-http keeps a request open for server->client messages.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    add_header X-Content-Type-Options nosniff always;
}
