# 8n5c5rgaqa — the whole deployment. Copy the repository to any device, run
# `python3 deploy/configure.py`, then `docker compose -f deploy/docker-compose.yml up -d`.
#
# App processes only. nginx, MariaDB and Redis are all yours, all reached over
# your own network, and none of them is defined, built or started here. The two
# Redis addresses arrive from deploy/.env like every other setting; nothing is
# published except the two ports your nginx needs, and those bind to the address
# you chose, not to every interface.
#
# The sites volume covers sites/, which hides the asset manifest the image built.
# The web container copies it back from ASSET_STASH on every start, so `build` +
# `up -d` really does ship a new /m, /w or /docs bundle.

name: vernon-project

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: vernon-project:local
  env_file: .env
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  backend:
    <<: *app
    command: ["web"]
    ports:
      - "${BIND_ADDRESS}:${APP_PORT}:${APP_PORT}"
    healthcheck:
      # Frappe's own whitelisted ping (frappe/__init__.py). A plain GET that reads
      # nothing and writes nothing, and answers only once the app is really serving.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT}/api/method/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  websocket:
    <<: *app
    command: ["websocket"]
    ports:
      - "${BIND_ADDRESS}:${SOCKETIO_PORT}:${SOCKETIO_PORT}"

  scheduler:
    <<: *app
    command: ["scheduler"]

  worker-short:
    <<: *app
    command: ["worker"]
    environment:
      WORKER_QUEUE: short,default

  worker-long:
    <<: *app
    command: ["worker"]
    environment:
      WORKER_QUEUE: long

volumes:
  sites:
  logs:
