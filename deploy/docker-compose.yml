# r2dfiifbj5 — the whole deployment. Copy the repository to any device, run
# `python3 deploy/configure.py`, then `docker compose -f deploy/docker-compose.yml up -d`.
#
# No nginx and no MariaDB here, on purpose: both are yours, reached over your own
# network. Redis IS here — it is this deployment's own cache and job queue, holds
# nothing that outlives a restart, and bundling it is what keeps "copy it anywhere"
# true. Nothing is published except the two ports your nginx needs, and those bind
# to the address you chose, not to every interface.

name: vernon-project

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: vernon-project:local
  env_file: .env
  restart: unless-stopped
  depends_on: [redis-cache, redis-queue]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  backend:
    <<: *app
    command: ["web"]
    ports:
      - "${BIND_ADDRESS}:${APP_PORT}:${APP_PORT}"
    healthcheck:
      # Frappe's own whitelisted ping (frappe/__init__.py). Answers only once the
      # app is actually serving.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT}/api/method/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  websocket:
    <<: *app
    command: ["websocket"]
    ports:
      - "${BIND_ADDRESS}:${SOCKETIO_PORT}:${SOCKETIO_PORT}"

  scheduler:
    <<: *app
    command: ["scheduler"]

  worker-short:
    <<: *app
    command: ["worker"]
    environment:
      WORKER_QUEUE: short,default

  worker-long:
    <<: *app
    command: ["worker"]
    environment:
      WORKER_QUEUE: long

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache only: losing it costs a warm-up, never data. Not published.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-queue:/data

volumes:
  sites:
  logs:
  redis-queue:
